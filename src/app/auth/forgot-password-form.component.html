<form class="forgot-form" (ngSubmit)="submit()">
  <p class="forgot-hint">
    Укажите email, привязанный к аккаунту. Мы отправим на него одноразовую ссылку
    для сброса пароля. Ссылка действует 2 минуты.
  </p>

  <label for="forgotEmail">Email</label>
  <input
    id="forgotEmail"
    name="forgotEmail"
    type="email"
    autocomplete="email"
    [(ngModel)]="email"
  />
  @if (emailError) {
    <p class="field-error">{{ emailError }}</p>
  }

  <div class="forgot-actions">
    <button type="submit" class="primary" [disabled]="isSubmitting || cooldownSeconds > 0">
      @if (isSubmitting) {
        Отправляем...
      } @else if (cooldownSeconds > 0) {
        Повторить через {{ cooldownLabel() }}
      } @else {
        Отправить ссылку
      }
    </button>
  </div>
</form>
