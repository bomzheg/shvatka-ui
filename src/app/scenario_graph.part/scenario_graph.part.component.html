@if (!hasLevels()) {
  <p class="graph-empty">В игре нет уровней — граф переходов недоступен.</p>
} @else {
  <div class="graph-legend">
    <span class="legend-item">
      <span class="legend-swatch legend-spine"></span>
      обычный переход (по ключу)
    </span>
    @if (hasJumps()) {
      <span class="legend-item">
        <span class="legend-swatch legend-key"></span>
        переход по ключу с эффектом
      </span>
      <span class="legend-item">
        <span class="legend-swatch legend-timer"></span>
        переход по таймеру
      </span>
    }
  </div>

  @if (!hasJumps()) {
    <p class="graph-note">
      <mat-icon class="app-icon-inline" [svgIcon]="AppIcon.jump"/>
      В сценарии нет переходов «через уровень» — игра идёт строго по порядку.
    </p>
  }

  <div class="graph-wrap">
    <svg
      class="graph-svg"
      [attr.viewBox]="'0 0 ' + model.width + ' ' + model.height"
      [attr.width]="model.width"
      [attr.height]="model.height"
      role="img"
      aria-label="Граф переходов между уровнями">
      <defs>
        <marker
          id="scn-graph-arrow"
          viewBox="0 0 10 10"
          refX="9"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z"/>
        </marker>
      </defs>

      @for (edge of model.spine; track $index) {
        <path class="edge-spine" [attr.d]="edge.d" marker-end="url(#scn-graph-arrow)"/>
      }

      @for (jump of model.jumps; track $index) {
        <path
          class="edge-jump"
          [class.edge-jump-key]="jump.kind === 'key'"
          [class.edge-jump-timer]="jump.kind === 'timer'"
          [class.edge-jump-back]="jump.back"
          [attr.d]="jump.d"
          marker-end="url(#scn-graph-arrow)"/>
        <text
          class="edge-label"
          [class.edge-label-key]="jump.kind === 'key'"
          [class.edge-label-timer]="jump.kind === 'timer'"
          [attr.x]="jump.labelX"
          [attr.y]="jump.labelY">{{ jump.label }}</text>
      }

      @for (node of model.nodes; track $index) {
        <g class="node" [class.node-finish]="node.isFinish">
          <rect
            class="node-box"
            [attr.x]="node.x"
            [attr.y]="node.y"
            [attr.width]="node.w"
            [attr.height]="node.h"
            rx="9"
            ry="9"/>
          <text
            class="node-text"
            [attr.x]="node.cx"
            [attr.y]="node.cy">{{ node.title }}
            <title>{{ node.fullTitle }}</title>
          </text>
        </g>
      }
    </svg>
  </div>
}
