<app-header *ngIf="!isOneTimeTokenRoute"/>
<main class="app-shell">
  <div class="app-content">
    <router-outlet/>
  </div>
</main>
<footer class="version-footer">
  <button class="version-button" type="button" (click)="toggleDebugInfo()">
    FE {{ formatVersionShort(frontendVersion) }} {{ formatVersionTime(frontendVersion) }}
    <br/>
    BE {{ formatVersionShort(backendVersion) }} {{ formatVersionTime(backendVersion) }}
  </button>
  <ng-container *ngIf="showDebugInfo">
    <a *ngIf="isAdmin()" class="admin-panel-button" routerLink="/admin">Админ-панель</a>
    <pre class="debug-panel">{{ debugInfo || "No tg auth debug logs yet." }}</pre>
  </ng-container>
</footer>
<app-heic-upload-prompt/>
